
name: MinGW CI Build

on:
  push:
    branches: [principalis]
  pull_request:
    branches: [principalis]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            make
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-binutils
            mingw-w64-i686-gcc
            mingw-w64-i686-binutils

      - name: Diagnose toolchain
        shell: msys2 {0}
        run: |
          echo "MSYSTEM=$MSYSTEM"
          which make
          which gcc
          which cpp
          which windres
          make --version
          gcc --version
          cpp --version
          windres --version

      - name: Build project
        shell: msys2 {0}
        run: |
          make

      - name: Verify build outputs
        shell: pwsh
        run: |
          $expected = @(
            "sppc32.dll"
            "sppc64.dll"
            "sppcplus32.dll"
            "sppcplus64.dll"
          )
          $files = @(Get-ChildItem -Path . -File -Filter *.dll)

          $missing = @($expected | Where-Object { $_ -notin $files.Name })
          if ($missing.Count -gt 0) {
            throw "Expected build outputs are missing: $($missing -join ', ')"
          }

          $files | ForEach-Object {
            Write-Host "Found: $($_.FullName)"
          }

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $files = @(
            Get-ChildItem -Path . -Recurse -File -Include *.dll
          )

          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($file.Name)"
          }

          $lines | Set-Content SHA256SUMS.txt -Encoding ascii
          Get-Content SHA256SUMS.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mingw-build-${{ github.sha }}
          path: |
            sppc32.dll
            sppc64.dll
            sppcplus32.dll
            sppcplus64.dll
            SHA256SUMS.txt
          if-no-files-found: error

  release:
    if: github.ref == 'refs/heads/principalis' && github.event_name != 'pull_request'
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: mingw-build-${{ github.sha }}
          path: release-assets

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $expected = @(
            "sppc32.dll"
            "sppc64.dll"
            "sppcplus32.dll"
            "sppcplus64.dll"
            "SHA256SUMS.txt"
          )
          $files = @(Get-ChildItem -Path release-assets -File)
          $missing = @($expected | Where-Object { $_ -notin $files.Name })
          if ($missing.Count -gt 0) {
            throw "Release assets are missing: $($missing -join ', ')"
          }

          $versionTags = @(
            git tag --list |
              Where-Object { $_ -match '^v?\d+\.\d+(\.\d+)?$' } |
              ForEach-Object {
                $version = $_ -replace '^v', ''
                [pscustomobject]@{ Tag = $_; Version = [version]$version }
              } |
              Sort-Object Version -Descending
          )
          if ($versionTags.Count -eq 0) {
            throw "No version tag was found to use as the release base."
          }

          $baseVersion = $versionTags[0].Version.ToString(2)
          $shortSha = $env:GITHUB_SHA.Substring(0, 7)
          $tag = "$baseVersion-build.$env:GITHUB_RUN_NUMBER-$shortSha-$env:GITHUB_RUN_ATTEMPT"
          $assets = @($expected | ForEach-Object { Join-Path "release-assets" $_ })

          gh release create $tag --target "$env:GITHUB_SHA" --title "$baseVersion build #$env:GITHUB_RUN_NUMBER ($shortSha)" --notes "Automated build of version $baseVersion.`n`nCommit: $env:GITHUB_SHA`nBuild: $env:GITHUB_RUN_NUMBER`nDate (UTC): $([DateTime]::UtcNow.ToString('yyyy-MM-dd HH:mm:ss'))" @assets
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
